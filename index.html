<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizarra Táctica de Baloncesto - PRO MVP</title>
    <!-- 🏠 CONEXIÓN CON EL VESTUARIO (ESTILOS CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Toast de Notificaciones Flotantes -->
    <div class="toast-notification" id="toast"></div>

    <div class="app-container">
        
        <!-- 1. COLUMNA IZQUIERDA: BIBLIOTECA -->
    <div class="sidebar">
        <!-- Selector de Roles -->
        <div class="role-selector">
            <button class="role-btn active" id="btn-role-coach" onclick="cambiarRol('entrenador')">Entrenador</button>
            <button class="role-btn" id="btn-role-admin" onclick="cambiarRol('admin')">Admin Escuela</button>
        </div>

        <!-- Botón de Nueva Jugada (OPCIÓN B) -->
        <button class="btn-new-play" onclick="nuevaJugada()">
            <span>➕ Nueva Jugada</span>
        </button>

        <!-- 📂 NUEVO: BOTÓN FÍSICO PARA ABRIR LA BIBLIOTECA EN LA NUBE -->
        <button class="btn-new-play" onclick="abrirBiblioteca()" style="margin-top: 10px; background-color: #2e7d32; border-color: #1b5e20;">
            <span>📂 Abrir Biblioteca</span>
        </button>

        <!-- Secciones de la Biblioteca Lateral (Se quedan como archivo alternativo) -->
        <div class="library-section">
            <h3>Mis Jugadas</h3>
            <div class="plays-list" id="list-personal">
                <!-- Se llena automáticamente con JavaScript -->
            </div>

            <h3>Jugadas de la Escuela</h3>
            <div class="plays-list" id="list-school">
                <!-- Se llena automáticamente con JavaScript -->
            </div>
        </div>
    </div>

        <!-- 2. COLUMNA DERECHA: PIZARRA Y CONTROLES -->
        <div class="main-panel">
            <!-- Barra de Control Superior -->
            <div class="control-bar">
                <div class="control-group">
                    <button class="btn-action" onclick="deshacerMovimiento()">↩ Deshacer</button>
                    <button class="btn-action primary" onclick="guardarJugada()">💾 Guardar Jugada</button>
                    <button class="btn-action" id="btn-duplicate" style="display: none; background-color: #0284c7;" onclick="duplicarJugadaOficial()">📋 Duplicar para Editar</button>
                </div>
                
                <div class="control-group">
                    <span id="play-title-display" style="font-weight: bold; color: #38bdf8;">Lienzo Nuevo</span>
                    <div class="connection-status">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="status-text">Online</span>
                    </div>
                </div>
            </div>

            <!-- Contenedor de Cancha Táctica -->
            <div class="court-container" id="basketball-court">
                <!-- Cancha en SVG -->
                <svg class="court-lines" viewBox="0 0 280 150">
                    <line x1="140" y1="0" x2="140" y2="150" stroke="#f8fafc" stroke-width="2"/>
                    <circle cx="140" cy="75" r="18" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    <circle cx="140" cy="75" r="2" fill="#f8fafc"/>
                    
                    <rect x="0" y="46" width="58" height="58" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    <path d="M 58,57 A 18,18 0 0,1 58,93" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    <path d="M 0,15 L 29,15 A 62.5,62.5 0 0,1 29,135 L 0,135" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    
                    <rect x="222" y="46" width="58" height="58" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    <path d="M 222,57 A 18,18 0 0,0 222,93" fill="none" stroke="#f8fafc" stroke-width="2"/>
                    <path d="M 280,15 L 251,15 A 62.5,62.5 0 0,0 251,135 L 280,135" fill="none" stroke="#f8fafc" stroke-width="2"/>
                </svg>

                <!-- FICHAS TÁCTICAS -->
                <!-- Atacantes Azules (1-5) -->
                <div class="token attack" style="left: 42%; top: 50%;" id="token-a1">1</div>
                <div class="token attack" style="left: 35%; top: 25%;" id="token-a2">2</div>
                <div class="token attack" style="left: 35%; top: 75%;" id="token-a3">3</div>
                <div class="token attack" style="left: 25%; top: 35%;" id="token-a4">4</div>
                <div class="token attack" style="left: 20%; top: 65%;" id="token-a5">5</div>

                <!-- Defensores Rojos (1-5) -->
                <div class="token defense" style="left: 32%; top: 50%;" id="token-d1">1</div>
                <div class="token defense" style="left: 25%; top: 22%;" id="token-d2">2</div>
                <div class="token defense" style="left: 25%; top: 78%;" id="token-d3">3</div>
                <div class="token defense" style="left: 15%; top: 40%;" id="token-d4">4</div>
                <div class="token defense" style="left: 10%; top: 60%;" id="token-d5">5</div>

                <!-- Balón Naranja -->
                <div class="token ball" style="left: 45%; top: 50%;" id="token-ball"></div>
            </div>

            <!-- 🏀 LÍNEA DE TIEMPO CON BOTÓN NUEVA JUGADA -->
            <div class="timeline-bar">
                <button class="btn-action" id="btn-prev" onclick="cambiarPaso(-1)" disabled>◀ Paso Anterior</button>
                <div class="step-indicator" id="step-indicator">Paso: 1 / 1</div>
                
                <!-- ➕ Botón Añadir Paso -->
                <button class="btn-action" id="btn-add-step">➕ Añadir Paso</button>
                
                <!-- ▶️ Botón de Reproducción Automática -->
                <button class="btn-action btn-play" id="btn-play-pause">▶ Reproducir</button>
                
                <!-- ↩️ Botón Deshacer -->
                <button class="btn-action btn-undo" id="btn-undo">↩️ Deshacer</button>
                
                <!-- 📄 NUEVO: Botón Nueva Jugada (Color Peligro/Rojo) -->
                <button class="btn-action btn-danger" id="btn-clear-all">📄 Nueva Jugada</button>
                
                <!-- 🗑️ Botón de Eliminar Paso -->
                <button class="btn-action btn-danger" id="btn-delete-step">🗑️ Eliminar Paso</button>
                
                <button class="btn-action" id="btn-next" onclick="cambiarPaso(1)" disabled>Siguiente Paso ▶</button>
            </div>
        </div>

    </div>

    <!-- ☁️ INVITACIÓN AL INTÉRPRETE OFICIAL DE SUPABASE (LIBRERÍA DESDE CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ⚡ CONEXIÓN CON EL CEREBRO DE LA CASA (LÓGICA JAVASCRIPT) -->
    <script src="app.js"></script>

    <!-- 📂 MODAL DE LA BIBLIOTECA DE JUGADAS -->
<div id="modal-biblioteca" style="display: none; position: fixed; top: 10%; left: 10%; width: 80%; height: 80%; background: white; border: 2px solid black; z-index: 1000; padding: 20px;">
    <h2>📂 Biblioteca de Estrategias en la Nube</h2>
    
    <div style="display: flex; gap: 20px; height: 85%;">
        <!-- Columna Izquierda: La Escuela -->
        <div style="flex: 1; border-right: 2px solid gray; padding-right: 10px; overflow-y: auto;">
            <h3>🎒 Jugadas de la Escuela (Oficiales)</h3>
            <div id="lista-oficiales">Cargando...</div>
        </div>
        
        <!-- Columna Derecha: El Entrenador -->
        <div style="flex: 1; padding-left: 10px; overflow-y: auto;">
            <h3>👤 Mis Jugadas Personales</h3>
            <div id="lista-personales">Cargando...</div>
        </div>
    </div>
    
    <button onclick="cerrarBiblioteca()" style="margin-top: 10px; background: red; color: white;">❌ Cerrar</button>
</div>

<!-- ========================================================================= -->
<!-- 📺 CONTENEDOR FLOTANTE: BARRA DE NAVEGACIÓN DEL MODO PRESENTADOR          -->
<!-- ========================================================================= -->
<div id="barra-presentador" class="presenter-bar">
    
    <!-- 1. Botón para retroceder en la secuencia táctica -->
    <button id="btn-presentador-anterior" class="btn-tactil-gigante">
        ◀️ Anterior
    </button>
    
    <!-- 2. Marcador visual del paso actual (solo lectura para el equipo) -->
    <span id="marcador-pasos" class="marcador-texto">
        Paso -- de --
    </span>
    
    <!-- 3. Salida de Emergencia (Tu propuesta estrella para tabletas) -->
    <button id="btn-presentador-salir" class="btn-tactil-gigante btn-rojo">
        ❌ Salir
    </button>
    
    <!-- 4. Botón para avanzar en la secuencia táctica -->
    <button id="btn-presentador-siguiente" class="btn-tactil-gigante">
        ▶️ Siguiente
    </button>
    
</div>
</body>
</html>
